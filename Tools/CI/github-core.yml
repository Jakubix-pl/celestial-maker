name: Core regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Compile shared game engine and simulator
        run: dotnet build Tools/Expansion -c Release
      - name: Run portable Core regression
        run: dotnet Tools/Expansion/bin/Release/net8.0/Expansion.dll "$GITHUB_WORKSPACE"
      - name: Audit engineering, challenges and fresh scenarios
        run: dotnet Tools/Expansion/bin/Release/net8.0/Expansion.dll "$GITHUB_WORKSPACE" --system-audit
